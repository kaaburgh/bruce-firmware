name: SD SPI CMD25 busy-release policy unit tests
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run host C++ Stop Tran busy-release tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/sd_spi_stop_wait_test.cpp -o /tmp/sd_spi_stop_wait_test
          /tmp/sd_spi_stop_wait_test
